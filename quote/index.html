<!doctype html>
<html lang="en-IN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your quote | outrr</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png?v=3">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--terra:#BE5633;--char:#2E2E2E;--muted:#7a756c;--line:#e6e0d4;--sand:#F6F1E7}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,system-ui,sans-serif;color:var(--char);background:var(--sand);line-height:1.55;font-size:14.5px}
.sheet{max-width:820px;margin:24px auto;background:#fff;border-radius:14px;padding:34px 38px;box-shadow:0 6px 30px rgba(0,0,0,.06)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--char);padding-bottom:14px}
.hd img{height:30px}.hd .r{text-align:right;font-size:13px;color:var(--muted)}.hd .r b{display:block;color:var(--char);font-size:18px}
h2{font-size:15px;margin:22px 0 8px}table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--sand);text-align:left;padding:9px 10px;font-weight:600}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}.d{color:var(--muted);font-size:12.5px}
.tot td{border:0;padding:5px 10px}.tot .g td{font-weight:700;font-size:16px;border-top:2px solid var(--char);padding-top:10px}
.terms{white-space:pre-wrap;font-size:13px;color:#4a453e}.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#F6EAD9;color:#9A4A22}
.pill.ok{background:#2E2E2E;color:#fff}.acc{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:12px;background:#FBF8F2}
.acc input{width:100%;padding:11px 12px;border:1px solid #D9CEBD;border-radius:10px;font:inherit;margin:8px 0}.btn{background:var(--terra);color:#fff;border:0;border-radius:99px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:#fff;color:var(--char);border:1px solid var(--line)}.err{color:#b3261e;font-size:13px;margin-top:6px}.bar{display:flex;gap:10px;justify-content:flex-end;max-width:820px;margin:16px auto 0;padding:0 4px}
.msg{max-width:820px;margin:60px auto;text-align:center;background:#fff;border-radius:14px;padding:40px}
@media(max-width:640px){.sheet{padding:22px 18px;margin:10px}.hd{flex-direction:column}.hd .r{text-align:left}}
@media print{body{background:#fff}.sheet{box-shadow:none;margin:0;max-width:none;padding:0}.bar,.acc{display:none}}</style>
</head><body>
<div id="app"><div class="msg">Loading your quote…</div></div>
<script>
window.OUTRR_SUPA = { url: "https://ewgpvclqbnaeucvjnuch.supabase.co", anon: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4d3VtemtkeWNsaGpxbmZueGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MjI4NjEsImV4cCI6MjA4NDQ5ODg2MX0.RUQj6yMD-s2ZcDmJRgmHL6TZThQb26cLziv61a07pmg" };
(function () {
  var S = window.OUTRR_SUPA, t = new URLSearchParams(location.search).get('t') || '', app = document.getElementById('app')
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
  var rs = function (n) { return '₹' + (Math.round((+n || 0) * 100) / 100).toLocaleString('en-IN') }
  var d8 = function (x) { return x ? new Date(x).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '' }
  function rpc(fn, a) { return fetch(S.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: S.anon, Authorization: 'Bearer ' + S.anon, 'Content-Type': 'application/json' }, body: JSON.stringify(a) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.message || 'Something went wrong'); return j }) }) }
  function draw(q, err) {
    if (!q) { app.innerHTML = '<div class="msg"><h2>Quote not found</h2><p>This link is not valid. Please ask the outrr team for a new one.</p></div>'; return }
    var gst = Math.round((q.total - q.subtotal) * 100) / 100
    app.innerHTML = '<div class="bar"><button class="btn g" onclick="print()">Download PDF</button></div><div class="sheet">' +
      '<div class="hd"><div><img src="/img/outrr-logo.png?v=3" alt="outrr"><div class="d" style="margin-top:6px">' + esc((q.company && q.company.name) || 'outrr') + (q.company && q.company.email ? ' · ' + esc(q.company.email) : '') + (q.company && q.company.phone ? ' · ' + esc(q.company.phone) : '') + '</div></div>' +
      '<div class="r"><b>Quote ' + esc(q.quote_no) + '</b>Date ' + d8(q.created_at) + '<br>Valid till ' + d8(q.valid_till) + '<br><span class="pill' + (q.status === 'accepted' ? ' ok' : '') + '">' + (q.status === 'accepted' ? 'Accepted' : q.status === 'expired' ? 'Expired' : 'Open') + '</span></div></div>' +
      '<h2>Prepared for</h2><p><b>' + esc(q.customer && q.customer.name) + '</b>' + (q.customer && q.customer.city ? ', ' + esc(q.customer.city) : '') + '</p>' +
      '<h2>Items</h2><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>' +
      (q.items || []).map(function (it) { return '<tr><td><b>' + esc(it.name) + '</b>' + (it.details ? '<div class="d">' + esc(it.details) + '</div>' : '') + '</td><td class="n">' + esc(it.qty) + '</td><td class="n">' + rs(it.rate) + '</td><td class="n">' + rs(it.qty * it.rate) + '</td></tr>' }).join('') +
      '</tbody></table><table class="tot"><tr><td></td><td class="n">Subtotal</td><td class="n" style="width:150px">' + rs(q.subtotal) + '</td></tr><tr><td></td><td class="n">GST ' + esc(q.gst_pct) + '%</td><td class="n">' + rs(gst) + '</td></tr><tr class="g"><td></td><td class="n">Total</td><td class="n">' + rs(q.total) + '</td></tr></table>' +
      (q.terms ? '<h2>Terms</h2><p class="terms">' + esc(q.terms) + '</p>' : '') +
      (q.status === 'accepted' ? '<p style="margin-top:20px"><b>Accepted by ' + esc(q.accepted_name) + ' on ' + d8(q.accepted_at) + '.</b> Our team will call you with the next steps.</p>'
        : q.status === 'expired' ? '<p style="margin-top:20px"><b>This quote has expired.</b> Please ask us for a fresh one.</p>'
        : '<div class="acc"><b>Accept this quote</b><p class="d">Type your full name to accept. Our team will call you to confirm the details and the advance payment.</p><input id="an" placeholder="Your full name" autocomplete="name">' + (err ? '<div class="err">' + esc(err) + '</div>' : '') + '<button class="btn" id="ago">Accept quote</button></div>') +
      '</div>'
    var b = document.getElementById('ago'); if (b) b.onclick = function () { var n = document.getElementById('an').value.trim(); if (n.length < 2) return draw(q, 'Type your full name');
      b.disabled = true; b.textContent = 'Accepting…'; rpc('quote_accept', { p_token: t, p_name: n }).then(function () { return rpc('quote_public', { p_token: t }) }).then(function (x) { draw(x) }).catch(function (e) { draw(q, e.message) }) }
  }
  if (t.length < 40) return draw(null)
  rpc('quote_public', { p_token: t }).then(function (q) { draw(q) }).catch(function () { draw(null) })
})()
</script>
</body></html>
